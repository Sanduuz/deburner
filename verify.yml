---
- name: Verify the provisioned burner
  hosts: burner
  become: true
  gather_facts: true
  vars_files:
    - - local.yml
      - local.yml.example
  pre_tasks:
    - name: Load the customization defaults for verification
      ansible.builtin.include_vars:
        file: roles/customization/defaults/main.yml
        name: verification_customization_defaults

    - name: Load the hardening defaults for verification
      ansible.builtin.include_vars:
        file: roles/hardening/defaults/main.yml
        name: verification_hardening_defaults

    - name: Load the offline mirror defaults for verification
      ansible.builtin.include_vars:
        file: roles/offline_mirror/defaults/main.yml
        name: verification_offline_mirror_defaults

    - name: Load the mobile tooling defaults for verification
      ansible.builtin.include_vars:
        file: roles/tooling_mobile/defaults/main.yml
        name: verification_mobile_defaults

    - name: Require the supported local Debian baseline
      ansible.builtin.assert:
        that:
          - ansible_facts.distribution == 'Debian'
          - ansible_facts.distribution_major_version == '13'
          - ansible_facts.architecture == 'x86_64'
          - ansible_facts.service_mgr == 'systemd'
          - ansible_connection == 'local'
        fail_msg: This playbook supports locally managed Debian 13 amd64 with systemd only.
  roles:
    - verification
