---
# Standard burner provisioning, in dependency order. Keep optional features in
# their own playbooks so running this file does not expose additional services.
- name: Verify provisioning network access
  ansible.builtin.import_playbook: preflight.yml

- name: Apply the hardening baseline
  ansible.builtin.import_playbook: hardening.yml

- name: Install core workstation tooling
  ansible.builtin.import_playbook: tooling-core.yml

- name: Install network and VPN tooling
  ansible.builtin.import_playbook: tooling-network.yml

- name: Install tunnelling and pivoting tooling
  ansible.builtin.import_playbook: tooling-pivoting.yml

- name: Install system and file analysis tooling
  ansible.builtin.import_playbook: tooling-analysis.yml

- name: Install steganography and media-analysis tooling
  ansible.builtin.import_playbook: tooling-media.yml

- name: Install Windows and Active Directory tooling
  ansible.builtin.import_playbook: tooling-windows.yml

- name: Install desktop workstation tooling
  ansible.builtin.import_playbook: tooling-desktop.yml

- name: Install exploitation and debugging tooling
  ansible.builtin.import_playbook: tooling-exploitation.yml

- name: Install reverse-engineering tooling
  ansible.builtin.import_playbook: tooling-reversing.yml

- name: Install web security tooling
  ansible.builtin.import_playbook: tooling-web.yml

- name: Install CTF wordlists
  ansible.builtin.import_playbook: tooling-wordlists.yml

- name: Install Docker tooling
  ansible.builtin.import_playbook: docker.yml

- name: Install command-and-control tooling
  ansible.builtin.import_playbook: tooling-c2.yml

- name: Stage optional BloodHound Community Edition tooling
  ansible.builtin.import_playbook: tooling-bloodhound.yml

- name: Apply user and desktop customizations
  ansible.builtin.import_playbook: customization.yml

- name: Synchronize the optional offline Debian mirror
  ansible.builtin.import_playbook: mirror-sync.yml

- name: Record the provisioned system inventory
  ansible.builtin.import_playbook: provision-manifest.yml
