---
# Override the complete list in local.yml if a leaner base is preferred.
tooling_core_packages:
  - 7zip
  - apt-file
  - apt-show-versions
  - axel
  - bash-completion
  - binutils
  - build-essential
  - bzip2
  - ca-certificates
  - cmake
  - curl
  - dos2unix
  - file
  - flake8
  - git
  - golang
  - gzip
  - jq
  - less
  - lsof
  - manpages-dev
  - meson
  - nano
  - ninja-build
  - openssl
  - pass
  - pipx
  - pkg-config
  - pv
  - pwgen
  - python3
  - python3-dev
  - python3-lxml
  - python3-pip
  - python3-requests
  - python3-venv
  - ripgrep
  - rlwrap
  - rsync
  - screen
  - shellcheck
  - tar
  - tmux
  - tree
  - unzip
  - vim
  - wget
  - xz-utils
  - xmlstarlet
  - zip

tooling_core_rustup_target: x86_64-unknown-linux-gnu
tooling_core_rustup_init_url: https://static.rust-lang.org/rustup/dist/x86_64-unknown-linux-gnu/rustup-init
tooling_core_rustup_checksum_url: https://static.rust-lang.org/rustup/dist/x86_64-unknown-linux-gnu/rustup-init.sha256
tooling_core_rustup_home: /opt/rustup
tooling_core_rustup_cargo_home: /opt/rustup-cargo
tooling_core_rustup_archive: /var/cache/deburner/rustup-init
tooling_core_rustup_profile: default
tooling_core_rustup_toolchain: stable
tooling_core_rust_components:
  - rust-analyzer

tooling_core_rust_commands:
  - cargo
  - cargo-clippy
  - cargo-fmt
  - clippy-driver
  - rust-gdb
  - rust-gdbgui
  - rust-lldb
  - rust-analyzer
  - rustc
  - rustdoc
  - rustfmt
