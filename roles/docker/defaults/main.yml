---
# Members of this group can obtain root-equivalent control of the host.
# Leave empty to require sudo for Docker commands.
docker_group_users: []

# Bound container logs so a noisy challenge cannot consume the entire disk.
docker_log_driver: local
docker_log_max_size: 20m
docker_log_max_files: 5

# Preserve running containers across a daemon restart when Docker supports it.
docker_live_restore: true

# Docker's official stable repository for Debian 13 (trixie).
docker_apt_key_url: https://download.docker.com/linux/debian/gpg
docker_apt_key_fingerprint: 9DC858229FC7DD38854AE2D88D81803C0EBFCD88
docker_apt_repository_url: https://download.docker.com/linux/debian
docker_apt_suite: trixie
