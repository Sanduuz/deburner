---
- name: Validate wireless tooling configuration
  ansible.builtin.assert:
    that:
      - ansible_facts.distribution == 'Debian'
      - ansible_facts.distribution_major_version == '13'
      - ansible_facts.architecture == 'x86_64'
      - tooling_wireless_packages | type_debug == 'list'
      - tooling_wireless_packages | length > 0
      - >-
        tooling_wireless_packages
        | select('match', '^[a-z0-9][a-z0-9+.-]*$')
        | list | length == tooling_wireless_packages | length
    fail_msg: tooling_wireless_packages must be a non-empty list of Debian package names.

- name: Keep automatic MAC address changes disabled
  ansible.builtin.debconf:
    name: macchanger
    question: macchanger/automatically_run
    value: 'false'
    vtype: boolean

- name: Install wireless analysis packages
  ansible.builtin.apt:
    name: "{{ tooling_wireless_packages }}"
    state: present
    update_cache: true
    cache_valid_time: 3600
