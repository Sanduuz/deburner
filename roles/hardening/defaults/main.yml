---
# Apply pending package updates while preparing the machine online.
hardening_upgrade_packages: true
# Leave updates operator-controlled during exercises and offline operation.
hardening_automatic_security_updates: false
hardening_disable_ssh: true

# Disable workstation listeners and activation units that are unnecessary for
# the burner profile. Packages remain installed when desktop dependencies need
# them, but systemd cannot activate their daemons.
hardening_disabled_units:
  - avahi-daemon.service
  - avahi-daemon.socket
  - cups-browsed.service
  - cups.path
  - cups.service
  - cups.socket
  - exim4-base.service
  - exim4-base.timer
  - exim4.service

# Stop and disable these services at boot without masking them, so an operator
# can still start one explicitly for an event.
hardening_disabled_startable_units:
  - bluetooth.service

# These ports are reachable from ANY network. Prefer event-specific overrides.
hardening_allowed_tcp_ports: []
hardening_allowed_udp_ports: []

# Preserve ptrace, perf, user namespaces, forwarding and core dump defaults.
hardening_sysctl:
  kernel.kptr_restrict: 2
  kernel.dmesg_restrict: 1
  fs.protected_hardlinks: 1
  fs.protected_symlinks: 1
  fs.protected_fifos: 1
  fs.protected_regular: 2
  net.ipv4.conf.all.accept_redirects: 0
  net.ipv4.conf.default.accept_redirects: 0
  net.ipv4.conf.all.send_redirects: 0
  net.ipv4.conf.default.send_redirects: 0
  net.ipv6.conf.all.accept_redirects: 0
  net.ipv6.conf.default.accept_redirects: 0
  net.ipv4.tcp_syncookies: 1
