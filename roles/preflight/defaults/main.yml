---
preflight_network_timeout: 15
preflight_storage_path: /srv
preflight_minimum_free_bytes: 400000000000

# Each marker confirms that HTTPS reached the intended service rather than a
# captive portal or unrelated proxy response.
preflight_required_endpoints:
  - name: Debian package repository
    url: https://deb.debian.org/debian/dists/trixie/InRelease
    marker: 'Codename: trixie'
  - name: Docker package repository
    url: https://download.docker.com/linux/debian/dists/trixie/InRelease
    marker: 'Origin: Docker'
  - name: Metasploit package repository
    url: https://downloads.metasploit.com/data/releases/metasploit-framework/apt/dists/lucid/InRelease
    marker: 'Origin: Metasploit Framework'
  - name: GitHub release API
    url: https://api.github.com/repos/NationalSecurityAgency/ghidra/releases/latest
    marker: '"tag_name"'
  - name: PortSwigger release service
    url: https://portswigger.net/burp/releases
    marker: 'Burp Suite Releases'
  - name: Python package registry
    url: https://pypi.org/pypi/volatility3/json
    marker: '"volatility3"'
  - name: Ruby package registry
    url: https://rubygems.org/api/v1/gems/zsteg.json
    marker: '"name":"zsteg"'
  - name: Rust distribution service
    url: https://static.rust-lang.org/rustup/dist/x86_64-unknown-linux-gnu/rustup-init.sha256
    marker: 'rustup-init'
  - name: conda-forge SageMath metadata
    url: https://api.anaconda.org/package/conda-forge/sage
    marker: '"name": "sage"'

preflight_android_endpoints:
  - name: Android Studio release service
    url: https://developer.android.com/studio
    marker: Android Studio
  - name: Android SDK package repository
    url: https://dl.google.com/android/repository/repository2-1.xml
    marker: sdk-repository
  - name: rootAVD GitLab API
    url: https://gitlab.com/api/v4/projects/newbit%2FrootAVD/repository/branches/master
    marker: '"commit"'

preflight_offline_mirror_endpoints:
  - name: Debian security package repository
    url: https://security.debian.org/debian-security/dists/trixie-security/InRelease
    marker: 'Codename: trixie-security'

preflight_docker_hub_endpoints:
  - name: Docker Hub container registry
    url: https://registry-1.docker.io/v2/
    status_codes:
      - 401
    marker: UNAUTHORIZED
  - name: Docker Hub registry authentication
    url: https://auth.docker.io/token?service=registry.docker.io&scope=repository:library/nginx:pull
    marker: '"token"'

preflight_ghcr_endpoints:
  - name: GitHub container registry
    url: https://ghcr.io/v2/
    status_codes:
      - 401
    marker: UNAUTHORIZED
  - name: GitHub container registry authentication
    url: https://ghcr.io/token?scope=repository:shell-dot/tuoni/server:pull&service=ghcr.io
    marker: '"token"'
