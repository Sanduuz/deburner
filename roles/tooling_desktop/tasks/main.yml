---
- name: Validate the desktop package list
  ansible.builtin.assert:
    that:
      - tooling_desktop_packages | type_debug == 'list'
      - tooling_desktop_packages | length > 0
      - "'firefox-esr' in tooling_desktop_packages"
      - tooling_desktop_packages | select('match', '^[a-z0-9][a-z0-9+.-]*$') | list | length == tooling_desktop_packages | length
      - tooling_desktop_zed_release_api is match('^https://api\.github\.com/')
      - tooling_desktop_firefox_addon_api
        == 'https://addons.mozilla.org/api/v5/addons/addon/multi-account-containers/'
      - tooling_desktop_firefox_addon_id == '@testpilot-containers'
      - tooling_desktop_firefox_addon_slug == 'multi-account-containers'
      - tooling_desktop_firefox_addon_installation_mode == 'normal_installed'
      - tooling_desktop_firefox_extension_root
        == '/usr/local/share/deburner/firefox-extensions'
      - tooling_desktop_firefox_extension_path
        == '/usr/local/share/deburner/firefox-extensions/multi-account-containers.xpi'
      - tooling_desktop_firefox_policy_path == '/etc/firefox/policies/policies.json'
    fail_msg: Review the desktop tooling variables; one or more values are invalid.

- name: Install desktop workstation packages
  ansible.builtin.apt:
    name: "{{ tooling_desktop_packages }}"
    state: present
    update_cache: true
    cache_valid_time: 3600

- name: Create the desktop artifact cache
  ansible.builtin.file:
    path: /var/cache/deburner
    state: directory
    owner: root
    group: root
    mode: '0755'

- name: Create the system desktop launcher directory
  ansible.builtin.file:
    path: /usr/local/share/applications
    state: directory
    owner: root
    group: root
    mode: '0755'

- name: Read the current Firefox Multi-Account Containers release
  ansible.builtin.uri:
    url: "{{ tooling_desktop_firefox_addon_api }}"
    return_content: true
    validate_certs: true
  register: tooling_desktop_firefox_addon_release
  changed_when: false

- name: Validate the Firefox extension release metadata
  ansible.builtin.assert:
    that:
      - tooling_desktop_firefox_addon_release.json.guid
        == tooling_desktop_firefox_addon_id
      - tooling_desktop_firefox_addon_release.json.slug
        == tooling_desktop_firefox_addon_slug
      - tooling_desktop_firefox_addon_release.json.current_version.version
        is match('^[0-9]+(?:\.[0-9]+)+$')
      - tooling_desktop_firefox_addon_release.json.current_version.file.url
        is match('^https://addons\.mozilla\.org/firefox/downloads/file/[0-9]+/')
      - tooling_desktop_firefox_addon_release.json.current_version.file.hash
        is match('^sha256:[0-9a-f]{64}$')
      - tooling_desktop_firefox_addon_release.json.current_version.file.status == 'public'
    fail_msg: >-
      Mozilla Add-ons did not return a valid current Multi-Account Containers release.

- name: Create the local Firefox extension directory
  ansible.builtin.file:
    path: "{{ tooling_desktop_firefox_extension_root }}"
    state: directory
    owner: root
    group: root
    mode: '0755'

- name: Download the current Firefox Multi-Account Containers extension
  ansible.builtin.get_url:
    url: "{{ tooling_desktop_firefox_addon_release.json.current_version.file.url }}"
    dest: "{{ tooling_desktop_firefox_extension_path }}"
    checksum: "{{ tooling_desktop_firefox_addon_release.json.current_version.file.hash }}"
    owner: root
    group: root
    mode: '0644'
    timeout: 60

- name: Read the downloaded Firefox extension manifest
  ansible.builtin.command:
    argv:
      - python3
      - -c
      - >-
        import json,sys,zipfile;
        archive=zipfile.ZipFile(sys.argv[1]);
        manifest=json.loads(archive.read('manifest.json'));
        archive.close();
        gecko=(manifest.get('browser_specific_settings', {}).get('gecko', {})
        or manifest.get('applications', {}).get('gecko', {}));
        print(json.dumps({'id': gecko.get('id'), 'version': manifest.get('version')}))
      - "{{ tooling_desktop_firefox_extension_path }}"
  register: tooling_desktop_firefox_extension_manifest_command
  changed_when: false

- name: Decode the downloaded Firefox extension manifest
  ansible.builtin.set_fact:
    tooling_desktop_firefox_extension_manifest: >-
      {{ tooling_desktop_firefox_extension_manifest_command.stdout | from_json }}

- name: Require the expected Firefox extension identity and version
  ansible.builtin.assert:
    that:
      - tooling_desktop_firefox_extension_manifest.id
        == tooling_desktop_firefox_addon_id
      - tooling_desktop_firefox_extension_manifest.version
        == tooling_desktop_firefox_addon_release.json.current_version.version
    fail_msg: The downloaded XPI manifest does not match the requested extension release.

- name: Create the system Firefox policy directory
  ansible.builtin.file:
    path: "{{ tooling_desktop_firefox_policy_path | dirname }}"
    state: directory
    owner: root
    group: root
    mode: '0755'

- name: Install the Firefox extension policy
  ansible.builtin.template:
    src: firefox-policies.json.j2
    dest: "{{ tooling_desktop_firefox_policy_path }}"
    owner: root
    group: root
    mode: '0644'
    validate: /usr/bin/python3 -m json.tool %s

- name: Read the latest stable Zed release
  ansible.builtin.uri:
    url: "{{ tooling_desktop_zed_release_api }}"
    headers: "{{ tooling_desktop_github_api_headers }}"
    return_content: true
  register: tooling_desktop_zed_release
  changed_when: false

- name: Select the Zed amd64 Linux archive
  ansible.builtin.set_fact:
    tooling_desktop_zed_assets: >-
      {{ tooling_desktop_zed_release.json.assets
         | selectattr('name', 'equalto', 'zed-linux-x86_64.tar.gz')
         | list }}

- name: Validate the latest Zed release metadata
  ansible.builtin.assert:
    that:
      - tooling_desktop_zed_release.json.tag_name is match('^v[0-9]+(?:\.[0-9]+)+$')
      - tooling_desktop_zed_assets | length == 1
      - tooling_desktop_zed_assets[0].digest | default('') is match('^sha256:[0-9a-f]{64}$')
    fail_msg: The latest Zed release does not contain the expected checksum-described amd64 archive.

- name: Define the current Zed artifact
  ansible.builtin.set_fact:
    tooling_desktop_zed_asset: "{{ tooling_desktop_zed_assets[0] }}"
    tooling_desktop_zed_install_dir: >-
      /opt/zed-{{ tooling_desktop_zed_release.json.tag_name | regex_replace('^v', '') }}

- name: Check whether the current Zed release is installed
  ansible.builtin.stat:
    path: "{{ tooling_desktop_zed_install_dir }}/zed.app/bin/zed"
  register: tooling_desktop_zed_executable

- name: Install the current Zed release
  when: not tooling_desktop_zed_executable.stat.exists
  block:
    - name: Create the Zed version directory
      ansible.builtin.file:
        path: "{{ tooling_desktop_zed_install_dir }}"
        state: directory
        owner: root
        group: root
        mode: '0755'

    - name: Download Zed
      ansible.builtin.get_url:
        url: "{{ tooling_desktop_zed_asset.browser_download_url }}"
        dest: "/var/cache/deburner/{{ tooling_desktop_zed_asset.name }}"
        checksum: "{{ tooling_desktop_zed_asset.digest }}"
        owner: root
        group: root
        mode: '0644'
        timeout: 60

    - name: Extract Zed under opt
      ansible.builtin.unarchive:
        src: "/var/cache/deburner/{{ tooling_desktop_zed_asset.name }}"
        dest: "{{ tooling_desktop_zed_install_dir }}"
        remote_src: true
        owner: root
        group: root

    - name: Remove the downloaded Zed archive
      ansible.builtin.file:
        path: "/var/cache/deburner/{{ tooling_desktop_zed_asset.name }}"
        state: absent

- name: Create the stable Zed path
  ansible.builtin.file:
    src: "{{ tooling_desktop_zed_install_dir }}/zed.app"
    dest: /opt/zed
    state: link
    force: true

- name: Install the Zed command
  ansible.builtin.file:
    src: /opt/zed/bin/zed
    dest: /usr/local/bin/zed
    state: link
    force: true

- name: Install the Zed desktop launcher
  ansible.builtin.copy:
    src: zed.desktop
    dest: /usr/local/share/applications/dev.zed.Zed.desktop
    owner: root
    group: root
    mode: '0644'
