---
# Graphical tools available directly from Debian. No application preferences or
# user profiles are managed by this role.
tooling_desktop_packages:
  - chromium
  - d-feet
  - gimp
  - libasound2t64
  - libatomic1
  - libblkid1
  - libffi8
  - libgcc-s1
  - libglib2.0-0t64
  - libselinux1
  - libvulkan1
  - meld
  - mesa-vulkan-drivers
  - pavucontrol
  - virt-manager
  - zlib1g

tooling_desktop_github_api_headers:
  Accept: application/vnd.github+json
  X-GitHub-Api-Version: '2022-11-28'

tooling_desktop_zed_release_api: https://api.github.com/repos/zed-industries/zed/releases/latest
