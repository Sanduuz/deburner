---
- name: Validate Crypto and CTF tooling configuration
  ansible.builtin.assert:
    that:
      - ansible_facts.distribution == 'Debian'
      - ansible_facts.distribution_major_version == '13'
      - ansible_facts.architecture == 'x86_64'
      - tooling_crypto_packages | type_debug == 'list'
      - tooling_crypto_packages | length > 0
      - >-
        tooling_crypto_packages
        | select('match', '^[a-z0-9][a-z0-9+.-]*$')
        | list | length == tooling_crypto_packages | length
      - tooling_crypto_rsactftool_repository == 'https://github.com/RsaCtfTool/RsaCtfTool.git'
      - tooling_crypto_rsactftool_branch is match('^[A-Za-z0-9._/-]+$')
      - tooling_crypto_rsactftool_python is match('^[0-9]+\.[0-9]+$')
      - tooling_crypto_cyberchef_release_api == 'https://api.github.com/repos/gchq/CyberChef/releases/latest'
      - >-
        tooling_crypto_micromamba_release_api
        == 'https://api.github.com/repos/mamba-org/micromamba-releases/releases/latest'
      - tooling_crypto_sagemath_prefix == '/opt/sagemath'
      - tooling_crypto_sagemath_install_timeout | int >= 3600
    fail_msg: Review the Crypto and CTF tooling variables; one or more values are invalid.

- name: Install Crypto and CTF runtime packages
  ansible.builtin.apt:
    name: "{{ tooling_crypto_packages }}"
    state: present
    update_cache: true
    cache_valid_time: 3600

- name: Inspect the upstream uv installation
  ansible.builtin.stat:
    path: /usr/local/bin/uv
  register: tooling_crypto_uv

- name: Require uv from the analysis tooling role
  ansible.builtin.assert:
    that:
      - tooling_crypto_uv.stat.exists
      - tooling_crypto_uv.stat.isreg or tooling_crypto_uv.stat.islnk
      - tooling_crypto_uv.stat.executable
    fail_msg: Run tooling-analysis.yml before tooling-crypto.yml so uv is available.

- name: Create Crypto and CTF installation directories
  ansible.builtin.file:
    path: "{{ item }}"
    state: directory
    owner: root
    group: root
    mode: '0755'
  loop:
    - /var/cache/deburner
    - /var/cache/deburner/uv
    - /opt/uv-python
    - /usr/local/share/applications

- name: Read the latest stable micromamba release
  ansible.builtin.uri:
    url: "{{ tooling_crypto_micromamba_release_api }}"
    headers: "{{ tooling_crypto_github_api_headers }}"
    return_content: true
  register: tooling_crypto_micromamba_release
  changed_when: false

- name: Select the micromamba amd64 Linux executable
  ansible.builtin.set_fact:
    tooling_crypto_micromamba_assets: >-
      {{ tooling_crypto_micromamba_release.json.assets
         | selectattr('name', 'equalto', 'micromamba-linux-64')
         | list }}

- name: Validate the latest stable micromamba release
  ansible.builtin.assert:
    that:
      - not tooling_crypto_micromamba_release.json.draft
      - not tooling_crypto_micromamba_release.json.prerelease
      - tooling_crypto_micromamba_release.json.tag_name is match('^[0-9]+(?:\.[0-9]+)+-[0-9]+$')
      - tooling_crypto_micromamba_assets | length == 1
      - tooling_crypto_micromamba_assets[0].digest | default('') is match('^sha256:[0-9a-f]{64}$')
      - >-
        tooling_crypto_micromamba_assets[0].browser_download_url
        is match('^https://github\.com/mamba-org/micromamba-releases/releases/download/')
    fail_msg: The latest micromamba release does not contain a checksum-described amd64 executable.

- name: Define the current micromamba artifact
  ansible.builtin.set_fact:
    tooling_crypto_micromamba_asset: "{{ tooling_crypto_micromamba_assets[0] }}"
    tooling_crypto_micromamba_install_dir: >-
      /opt/micromamba-{{ tooling_crypto_micromamba_release.json.tag_name }}

- name: Create the micromamba version directory
  ansible.builtin.file:
    path: "{{ tooling_crypto_micromamba_install_dir }}"
    state: directory
    owner: root
    group: root
    mode: '0755'

- name: Install the current micromamba release
  ansible.builtin.get_url:
    url: "{{ tooling_crypto_micromamba_asset.browser_download_url }}"
    dest: "{{ tooling_crypto_micromamba_install_dir }}/micromamba"
    checksum: "{{ tooling_crypto_micromamba_asset.digest }}"
    owner: root
    group: root
    mode: '0755'
    timeout: 120

- name: Create the stable micromamba command
  ansible.builtin.file:
    src: "{{ tooling_crypto_micromamba_install_dir }}/micromamba"
    dest: /usr/local/bin/micromamba
    state: link
    force: true

- name: Inspect the SageMath installation marker
  ansible.builtin.stat:
    path: "{{ tooling_crypto_sagemath_prefix }}/.deburner-install-complete"
  register: tooling_crypto_sagemath_marker

- name: Install SageMath from conda-forge
  when: not tooling_crypto_sagemath_marker.stat.exists
  block:
    - name: Create the SageMath conda environment
      ansible.builtin.command:
        argv:
          - /usr/local/bin/micromamba
          - --root-prefix
          - /opt/micromamba-root
          - create
          - --yes
          - --prefix
          - "{{ tooling_crypto_sagemath_prefix }}"
          - --channel
          - conda-forge
          - --strict-channel-priority
          - sage
      environment:
        MAMBA_NO_BANNER: '1'
      async: "{{ tooling_crypto_sagemath_install_timeout }}"
      poll: 10
      changed_when: true

    - name: Read the installed SageMath version
      ansible.builtin.command:
        argv:
          - "{{ tooling_crypto_sagemath_prefix }}/bin/sage"
          - --version
      register: tooling_crypto_sagemath_version
      changed_when: false

    - name: Mark the SageMath installation complete
      ansible.builtin.copy:
        content: "{{ tooling_crypto_sagemath_version.stdout | trim }}\n"
        dest: "{{ tooling_crypto_sagemath_prefix }}/.deburner-install-complete"
        owner: root
        group: root
        mode: '0644'

- name: Install the stable SageMath command
  ansible.builtin.file:
    src: "{{ tooling_crypto_sagemath_prefix }}/bin/sage"
    dest: /usr/local/bin/sage
    state: link
    force: true

- name: Validate the SageMath command
  ansible.builtin.command:
    argv:
      - /usr/local/bin/sage
      - --version
  changed_when: false

- name: Resolve the current RsaCtfTool commit
  ansible.builtin.command:
    argv:
      - git
      - ls-remote
      - --exit-code
      - "{{ tooling_crypto_rsactftool_repository }}"
      - "refs/heads/{{ tooling_crypto_rsactftool_branch }}"
  register: tooling_crypto_rsactftool_remote
  changed_when: false

- name: Validate the current RsaCtfTool commit
  ansible.builtin.assert:
    that:
      - tooling_crypto_rsactftool_remote.stdout_lines | length == 1
      - tooling_crypto_rsactftool_remote.stdout.split()[0] is match('^[0-9a-f]{40}$')
    fail_msg: The RsaCtfTool repository did not return one valid branch commit.

- name: Define current RsaCtfTool paths
  ansible.builtin.set_fact:
    tooling_crypto_rsactftool_commit: "{{ tooling_crypto_rsactftool_remote.stdout.split()[0] }}"
    tooling_crypto_rsactftool_source_dir: >-
      /opt/rsactftool-source-{{ tooling_crypto_rsactftool_remote.stdout.split()[0] }}
    tooling_crypto_rsactftool_install_dir: >-
      /opt/rsactftool-{{ tooling_crypto_rsactftool_remote.stdout.split()[0] }}

- name: Check whether the current RsaCtfTool commit is installed
  ansible.builtin.stat:
    path: "{{ tooling_crypto_rsactftool_install_dir }}/.deburner-install-complete"
  register: tooling_crypto_rsactftool_marker

- name: Install the current RsaCtfTool commit
  when: not tooling_crypto_rsactftool_marker.stat.exists
  block:
    - name: Clone the current RsaCtfTool commit
      ansible.builtin.git:
        repo: "{{ tooling_crypto_rsactftool_repository }}"
        dest: "{{ tooling_crypto_rsactftool_source_dir }}"
        version: "{{ tooling_crypto_rsactftool_commit }}"
        depth: 1

    - name: Create the isolated RsaCtfTool environment
      ansible.builtin.command:
        argv:
          - /usr/local/bin/uv
          - venv
          - --python
          - "{{ tooling_crypto_rsactftool_python }}"
          - "{{ tooling_crypto_rsactftool_install_dir }}"
        chdir: /opt
        creates: "{{ tooling_crypto_rsactftool_install_dir }}/bin/python"
      environment: &tooling_crypto_uv_environment
        UV_CACHE_DIR: /var/cache/deburner/uv
        UV_PYTHON_INSTALL_DIR: /opt/uv-python

    - name: Install RsaCtfTool and its declared dependencies
      ansible.builtin.command:
        argv:
          - /usr/local/bin/uv
          - pip
          - install
          - --python
          - "{{ tooling_crypto_rsactftool_install_dir }}/bin/python"
          - "{{ tooling_crypto_rsactftool_source_dir }}"
      environment: *tooling_crypto_uv_environment
      changed_when: true

    - name: Mark the RsaCtfTool installation complete
      ansible.builtin.copy:
        content: |
          commit={{ tooling_crypto_rsactftool_commit }}
          python={{ tooling_crypto_rsactftool_python }}
        dest: "{{ tooling_crypto_rsactftool_install_dir }}/.deburner-install-complete"
        owner: root
        group: root
        mode: '0644'

- name: Create the stable RsaCtfTool path
  ansible.builtin.file:
    src: "{{ tooling_crypto_rsactftool_install_dir }}"
    dest: /opt/rsactftool
    state: link
    force: true

- name: Install stable RsaCtfTool commands
  ansible.builtin.file:
    src: "/opt/rsactftool/bin/{{ item }}"
    dest: "/usr/local/bin/{{ item }}"
    state: link
    force: true
  loop:
    - RsaCtfTool
    - rsacrack

- name: Validate the RsaCtfTool command
  ansible.builtin.command:
    argv:
      - /usr/local/bin/RsaCtfTool
      - --help
  changed_when: false

- name: Read the latest stable CyberChef release
  ansible.builtin.uri:
    url: "{{ tooling_crypto_cyberchef_release_api }}"
    headers: "{{ tooling_crypto_github_api_headers }}"
    return_content: true
  register: tooling_crypto_cyberchef_release
  changed_when: false

- name: Select the CyberChef standalone archive
  ansible.builtin.set_fact:
    tooling_crypto_cyberchef_assets: >-
      {{ tooling_crypto_cyberchef_release.json.assets
         | selectattr('name', 'match', '^CyberChef_[A-Za-z0-9._-]+\.zip$')
         | list }}

- name: Validate the latest stable CyberChef release
  ansible.builtin.assert:
    that:
      - not tooling_crypto_cyberchef_release.json.draft
      - not tooling_crypto_cyberchef_release.json.prerelease
      - tooling_crypto_cyberchef_release.json.tag_name is match('^v[0-9]+(?:\.[0-9]+)+$')
      - tooling_crypto_cyberchef_assets | length == 1
      - tooling_crypto_cyberchef_assets[0].digest | default('') is match('^sha256:[0-9a-f]{64}$')
      - >-
        tooling_crypto_cyberchef_assets[0].browser_download_url
        is match('^https://github\.com/gchq/CyberChef/releases/download/')
    fail_msg: The latest CyberChef release does not contain one checksum-described standalone ZIP.

- name: Define the current CyberChef artifact
  ansible.builtin.set_fact:
    tooling_crypto_cyberchef_asset: "{{ tooling_crypto_cyberchef_assets[0] }}"
    tooling_crypto_cyberchef_version: >-
      {{ tooling_crypto_cyberchef_release.json.tag_name | regex_replace('^v', '') }}
    tooling_crypto_cyberchef_install_dir: >-
      /opt/cyberchef-{{ tooling_crypto_cyberchef_release.json.tag_name | regex_replace('^v', '') }}
    tooling_crypto_cyberchef_entrypoint: >-
      {{ '/opt/cyberchef-'
         ~ (tooling_crypto_cyberchef_release.json.tag_name | regex_replace('^v', ''))
         ~ '/CyberChef_' ~ tooling_crypto_cyberchef_release.json.tag_name ~ '.html' }}

- name: Check whether the current CyberChef release is installed
  ansible.builtin.stat:
    path: "{{ tooling_crypto_cyberchef_entrypoint }}"
  register: tooling_crypto_cyberchef_index

- name: Install the current CyberChef release
  when: not tooling_crypto_cyberchef_index.stat.exists
  block:
    - name: Create the CyberChef version directory
      ansible.builtin.file:
        path: "{{ tooling_crypto_cyberchef_install_dir }}"
        state: directory
        owner: root
        group: root
        mode: '0755'

    - name: Download CyberChef
      ansible.builtin.get_url:
        url: "{{ tooling_crypto_cyberchef_asset.browser_download_url }}"
        dest: "/var/cache/deburner/{{ tooling_crypto_cyberchef_asset.name }}"
        checksum: "{{ tooling_crypto_cyberchef_asset.digest }}"
        owner: root
        group: root
        mode: '0644'
        timeout: 120

    - name: Extract CyberChef under opt
      ansible.builtin.unarchive:
        src: "/var/cache/deburner/{{ tooling_crypto_cyberchef_asset.name }}"
        dest: "{{ tooling_crypto_cyberchef_install_dir }}"
        remote_src: true
        owner: root
        group: root

    - name: Remove the downloaded CyberChef archive
      ansible.builtin.file:
        path: "/var/cache/deburner/{{ tooling_crypto_cyberchef_asset.name }}"
        state: absent

- name: Require the CyberChef entry point
  ansible.builtin.stat:
    path: "{{ tooling_crypto_cyberchef_entrypoint }}"
  register: tooling_crypto_cyberchef_installed_index
  failed_when: not (tooling_crypto_cyberchef_installed_index.stat.isreg | default(false))

- name: Create a stable CyberChef entry point
  ansible.builtin.file:
    src: "{{ tooling_crypto_cyberchef_entrypoint }}"
    dest: "{{ tooling_crypto_cyberchef_install_dir }}/index.html"
    state: hard
    force: true
    owner: root
    group: root
    mode: '0644'

- name: Create the stable CyberChef path
  ansible.builtin.file:
    src: "{{ tooling_crypto_cyberchef_install_dir }}"
    dest: /opt/cyberchef
    state: link
    force: true

- name: Install the CyberChef command
  ansible.builtin.copy:
    src: cyberchef
    dest: /usr/local/bin/cyberchef
    owner: root
    group: root
    mode: '0755'

- name: Install the CyberChef desktop launcher
  ansible.builtin.copy:
    src: cyberchef.desktop
    dest: /usr/local/share/applications/cyberchef.desktop
    owner: root
    group: root
    mode: '0644'
